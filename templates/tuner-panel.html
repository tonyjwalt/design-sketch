<style>
  .tuner-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 999;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px 16px;
    font: 13px system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }
  .tuner-panel label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .tuner-panel input[type="range"] {
    flex: 1;
  }
</style>

<fieldset class="tuner-panel" id="tunerPanel">
  <legend>Tuners</legend>

  <!-- Continuous example — copy one label per value, edit data-target/name/min/max/value.
       data-readout is optional: point it at an <output> id to get a live value readout for free. -->
  <label>
    Spacing
    <input id="spacingRange" type="range" data-bind="css-var" data-target="--space-md" data-readout="spacingOut" min="4" max="64" value="16" step="4">
    <output id="spacingOut" for="spacingRange">16px</output>
  </label>

  <!-- Discrete example — copy one <select> per variant, edit data-target/data-prefix/options.
       data-target here is a selector for whatever element the class actually belongs on in THIS
       sketch — there's no fixed wrapper id to assume. Often `body`; use a real id/class you already
       gave the relevant container if one exists. -->
  <label>
    Layout
    <select data-bind="class-toggle" data-target="body" data-prefix="layout--">
      <option value="compact">Compact</option>
      <option value="spacious" selected>Spacious</option>
    </select>
  </label>
</fieldset>

<script>
(function () {
  var panel = document.getElementById('tunerPanel');
  if (!panel) return;

  panel.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.bind === 'css-var') {
      var unit = el.dataset.unit || (el.type === 'range' ? 'px' : '');
      document.documentElement.style.setProperty(el.dataset.target, el.value + unit);
      if (el.dataset.readout) {
        var out = document.getElementById(el.dataset.readout);
        if (out) out.textContent = el.value + unit;
      }
    }
  });

  panel.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.bind === 'class-toggle') {
      var target = document.querySelector(el.dataset.target);
      if (!target) return;
      var prefix = el.dataset.prefix || '';
      Array.from(target.classList).forEach(function (c) {
        if (c.indexOf(prefix) === 0) target.classList.remove(c);
      });
      target.classList.add(prefix + el.value);
    }
  });
})();
</script>
