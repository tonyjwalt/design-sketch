<style>
  .id-badge {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    background: #111;
    color: #fff;
    font: 11px/1.4 ui-monospace, monospace;
    padding: 4px 6px;
    border-radius: 3px;
    opacity: 0;
    transition: opacity 0.1s;
    white-space: nowrap;
  }
  .id-badge.visible {
    opacity: 1;
  }
  .id-badge-hint {
    color: #999;
  }
</style>

<script>
(function () {
  var badge = document.createElement('div');
  badge.className = 'id-badge';
  var titleLine = document.createElement('div');
  var hintLine = document.createElement('div');
  hintLine.className = 'id-badge-hint';
  badge.appendChild(titleLine);
  badge.appendChild(hintLine);
  document.body.appendChild(badge);

  var current = null;   // nearest ancestor carrying an id
  var leaf = null;      // deepest hovered element, may equal current
  var altHeld = false;

  function leafClass() {
    if (!leaf || leaf === current || !leaf.classList.length) return null;
    return leaf.classList[0];
  }

  function idLabel() {
    return '#' + current.id;
  }

  function fullLabel() {
    var cls = leafClass();
    return cls ? idLabel() + ' .' + cls : idLabel();
  }

  function render() {
    if (!current) {
      badge.classList.remove('visible');
      return;
    }
    titleLine.textContent = altHeld ? fullLabel() : idLabel();
    hintLine.textContent = altHeld ? '⌥C to copy' : 'C to copy';
    badge.classList.add('visible');
  }

  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('[id]');
    if (!el || el === document.body) {
      current = null;
      leaf = null;
      render();
      return;
    }
    current = el;
    leaf = e.target;
    render();
  });

  document.addEventListener('mousemove', function (e) {
    if (!current) return;
    badge.style.left = e.clientX + 12 + 'px';
    badge.style.top = e.clientY + 12 + 'px';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Alt') {
      altHeld = true;
      render();
      return;
    }
    if (!current || e.code !== 'KeyC') return;
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
    var text = e.altKey ? fullLabel() : idLabel();
    navigator.clipboard.writeText(text);
    hintLine.textContent = 'copied';
    setTimeout(function () {
      if (current) hintLine.textContent = altHeld ? '⌥C to copy' : 'C to copy';
    }, 600);
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === 'Alt') {
      altHeld = false;
      render();
    }
  });
})();
</script>
