<style>
  .tuner-panel {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 999;
    width: 260px;
    background: #fff;
    border: 1px solid #dcdfe4;
    border-radius: 10px;
    box-shadow: 0 12px 28px rgba(20, 22, 30, 0.18), 0 2px 6px rgba(20, 22, 30, 0.08);
    overflow: hidden;
    font: 13px system-ui, sans-serif;
  }
  /* <summary> is the collapse/expand toggle — native disclosure behavior, no JS needed. Its
     default marker/style varies by browser, so it's deliberately restyled below rather than
     left default. */
  .tuner-panel-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: #f4f5f7;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b7280;
    cursor: pointer;
    user-select: none;
    list-style: none;
  }
  .tuner-panel-header::-webkit-details-marker {
    display: none;
  }
  .tuner-panel-header::before {
    content: "\25b8";
    font-size: 16px;
    line-height: 1;
    color: #6b7280;
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .tuner-panel[open] > .tuner-panel-header {
    border-bottom: 1px solid #dcdfe4;
  }
  .tuner-panel[open] > .tuner-panel-header::before {
    transform: rotate(90deg);
  }
  .tuner-panel-header:focus-visible {
    outline: 2px solid #3366ff;
    outline-offset: -2px;
  }
  .tuner-panel-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px;
  }
  .tuner-panel-body > label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .tuner-panel input[type="range"] {
    flex: 1;
  }
  .tuner-panel .swatch-row {
    display: flex;
    gap: 4px;
  }
  .tuner-panel .swatch-row button {
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 4px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    cursor: pointer;
  }
</style>

<details class="tuner-panel" id="tunerPanel" open>
  <summary class="tuner-panel-header">Tuners</summary>
  <div class="tuner-panel-body">

  <!-- Continuous example — copy one label per value, edit data-target/name/min/max/value.
       data-readout is optional: point it at an <output> id to get a live value readout for free. -->
  <label>
    Spacing
    <input id="spacingRange" type="range" data-bind="css-var" data-target="--space-md" data-readout="spacingOut" min="4" max="64" value="16" step="4">
    <output id="spacingOut" for="spacingRange">16px</output>
  </label>

  <!-- Discrete example — copy one <select> per variant, edit data-target/data-prefix/options.
       data-target here is a selector for whatever element the class actually belongs on in THIS
       sketch — there's no fixed wrapper id to assume. Often `body`; use a real id/class you already
       gave the relevant container if one exists. -->
  <label>
    Layout
    <select data-bind="class-toggle" data-target="body" data-prefix="layout--">
      <option value="compact">Compact</option>
      <option value="spacious" selected>Spacious</option>
    </select>
  </label>

  <!-- Swatch example — use when a fixed palette already exists to choose among. Copy one
       <button value="..."> per swatch; the value IS the color it applies. If there's no palette
       yet and the tuner's job is to help find one, use <input type="color" data-bind="css-var"
       data-target="--x"> instead — it already works with the same css-var binding, no swatches
       needed (see references/tuner-conventions.md). -->
  <label>
    Accent
    <span class="swatch-row" role="group" aria-label="Accent color">
      <button type="button" value="#3366ff" data-bind="css-var" data-target="--accent-color" style="background:#3366ff" aria-label="#3366ff"></button>
      <button type="button" value="#e0403f" data-bind="css-var" data-target="--accent-color" style="background:#e0403f" aria-label="#e0403f"></button>
    </span>
  </label>

  </div>
</details>

<script>
(function () {
  var panel = document.getElementById('tunerPanel');
  if (!panel) return;

  function applyCssVar(el) {
    var unit = el.dataset.unit || (el.type === 'range' ? 'px' : '');
    document.documentElement.style.setProperty(el.dataset.target, el.value + unit);
    if (el.dataset.readout) {
      var out = document.getElementById(el.dataset.readout);
      if (out) out.textContent = el.value + unit;
    }
  }

  panel.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.bind === 'css-var') applyCssVar(el);
  });

  panel.addEventListener('click', function (e) {
    var el = e.target.closest('button[data-bind="css-var"]');
    if (el) applyCssVar(el);
  });

  panel.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.bind === 'class-toggle') {
      var target = document.querySelector(el.dataset.target);
      if (!target) return;
      var prefix = el.dataset.prefix || '';
      if (el.type === 'checkbox') {
        target.classList.toggle(prefix + el.value, el.checked);
        return;
      }
      Array.from(target.classList).forEach(function (c) {
        if (c.indexOf(prefix) === 0) target.classList.remove(c);
      });
      target.classList.add(prefix + el.value);
    }
  });
})();
</script>
